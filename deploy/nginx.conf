# /etc/nginx/sites-available/removalworksolution.online
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name removalworksolution.online www.removalworksolution.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://removalworksolution.online$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name removalworksolution.online www.removalworksolution.online;

    ssl_certificate     /etc/letsencrypt/live/removalworksolution.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/removalworksolution.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # CSV uploads (bulk scan) — 2 MB is plenty for 500 URLs
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;   # bulk scans can take a few minutes
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
}
