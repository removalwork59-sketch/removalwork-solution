name: Smoke Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live URL to test (e.g. https://removalworksolution.online). Leave empty to test a local build."
        required: false
        type: string
      admin_password:
        description: "Admin password (optional here; falls back to the ADMIN_PASSWORD secret)"
        required: false
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ADMIN_PASSWORD is required so every PR/build also exercises the
      # login-required pages (/dashboard, /scan, /history, /reports,
      # /settings, /profile). Fail fast with a clear message if missing.
      - name: Verify ADMIN_PASSWORD is configured
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::ADMIN_PASSWORD secret is not set. Add it in Repo Settings > Secrets and variables > Actions so login-required pages are tested."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test against live URL
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.base_url != ''
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password || secrets.ADMIN_PASSWORD }}
        run: python3 scripts/smoke_pages.py

      - name: Set up Bun
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.base_url == ''
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.base_url == ''
        run: bun install --frozen-lockfile

      - name: Start dev server
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.base_url == ''
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: |
          nohup bun run dev --port 8080 > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:8080/

      - name: Run smoke test (local build)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.base_url == ''
        env:
          BASE_URL: http://localhost:8080
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 scripts/smoke_pages.py

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: dev-server.log
          if-no-files-found: ignore

  # Runs after a successful main-branch build: smoke-tests the LIVE site and
  # fails this "deployment check" if any page is blank or errors.
  post-deploy-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify ADMIN_PASSWORD is configured
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::ADMIN_PASSWORD secret is not set. Add it in Repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Smoke test live site after deployment
        env:
          BASE_URL: ${{ vars.LIVE_URL || 'https://removalworksolution.online' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 scripts/smoke_pages.py
